# Fly.io deployment config for meal-planner-api
# Deploy: flyctl deploy (from backends/ directory)
# First-time setup: flyctl launch --no-deploy, then set secrets with flyctl secrets set KEY=VALUE

app = "<deine-app>"
primary_region = "fra"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
