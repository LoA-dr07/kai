# Fly.io deployment config for kai-api-long-feather-1592
# Deploy: flyctl deploy (from backends/ directory)
# First-time setup: flyctl launch --no-deploy, then set secrets with flyctl secrets set KEY=VALUE

app = "kai-api-long-feather-1592"
primary_region = "fra"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
