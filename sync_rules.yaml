# PowerSync sync rules – uploaded in the PowerSync Cloud dashboard
# (Instance → Edit → Sync Rules)
#
# Since this app has no authentication, a single global bucket syncs
# all data to every connected client (one household, ≤3 users).
#
# Tables without a primary-key `id` column (join tables) get a
# synthetic text id composed of their composite key columns.

bucket_definitions:
  global:
    data:
      # Core entities
      - SELECT * FROM households
      - SELECT * FROM users
      - SELECT * FROM recipes
      - SELECT * FROM ingredients
      - SELECT * FROM tags
      - SELECT * FROM recipe_ingredients
      - SELECT * FROM recipe_ratings
      - SELECT * FROM meal_plans
      - SELECT * FROM meal_plan_entries

      # Join tables: no natural id → build a synthetic one
      - SELECT
          household_id::text || '-' || user_id::text AS id,
          household_id,
          user_id
        FROM household_members

      - SELECT
          recipe_id::text || '-' || tag_id::text AS id,
          recipe_id,
          tag_id
        FROM recipe_tags

      - SELECT
          entry_id::text || '-' || user_id::text AS id,
          entry_id,
          user_id
        FROM meal_plan_entry_users
